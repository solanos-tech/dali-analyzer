[project]
name = "dali-analyzer-backend"
version = "0.9.4"
description = "Backend for dali-sniffer analysis and visualization"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "pyserial>=3.5",
    "uvicorn>=0.44.0",
]

[project.scripts]
dali-analyzer = "app.main:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"app" = ["specs/*.json"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.20.0",
    "pytest>=9.0.3",
    "ruff>=0.15.9",
]
