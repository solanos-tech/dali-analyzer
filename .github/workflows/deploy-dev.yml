name: Deploy Dev

on:
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-dev.yml"

permissions:
  contents: read

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Build frontend artifact
        run: npm run build
        working-directory: frontend

      - name: Upload frontend dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dev-dist
          path: frontend/dist

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync backend dependencies
        run: uv sync
        working-directory: backend

      - name: Build backend artifact
        run: uv build
        working-directory: backend

      - name: Upload backend dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dev-dist
          path: backend/dist

      - name: Deploy dev simulation
        run: |
          echo "Dev deployment gate passed: frontend and backend artifacts are ready."
