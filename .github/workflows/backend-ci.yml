name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest

      - name: Mypy
        run: uv run mypy app

  backend-build:
    runs-on: ubuntu-latest
    needs: backend-checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync dependencies
        run: uv sync

      - name: Build package
        run: uv build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist

  backend-package-inspect:
    runs-on: ubuntu-latest
    needs: backend-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: downloaded-dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install built wheel
        run: pip install downloaded-dist/*.whl

      - name: Start API from built wheel
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo $! > uvicorn.pid
          sleep 5

      - name: Call health endpoint
        run: curl --fail http://127.0.0.1:8000/health

      - name: Call frames endpoint
        run: curl --fail "http://127.0.0.1:8000/api/frames?source=mock"

      - name: Call v2 logs endpoint (spec/runtime smoke)
        run: curl --fail "http://127.0.0.1:8000/api/v2/logs"

      - name: Stop API
        if: always()
        run: kill $(cat uvicorn.pid) || true
