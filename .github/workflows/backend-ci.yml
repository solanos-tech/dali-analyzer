name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print event type
        run: 'echo "Event: ${{ github.event_name }}" || true'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync dependencies
        run: uv sync

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest

      - name: Mypy
        run: uv run mypy app

  backend-build:
    runs-on: ubuntu-latest
    needs: backend-checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync dependencies
        run: uv sync

      - name: Build package
        run: uv build

      - name: List dist files
        run: ls -la dist
    
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist        

  backend-package-inspect:
    runs-on: ubuntu-latest
    needs: backend-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: downloaded-dist

      - name: List downloaded files
        run: ls -la downloaded-dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install built wheel
        run: pip install downloaded-dist/*.whl

      - name: Verify import
        run: python -c "import app.main; print('Import OK')"

      - name: Start API from built wheel
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo $! > uvicorn.pid
          sleep 5

      - name: Call health endpoint
        run: |
          curl --fail http://127.0.0.1:8000/health

      - name: Stop API
        if: always()
        run: |
          kill $(cat uvicorn.pid) || true

  backend-deploy:
    runs-on: ubuntu-latest
    needs: backend-package-inspect
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: prod

    steps:
      - name: Print deployment target
        run: echo "Deploying backend artifact to prod environment"

      - name: Print deployment revision
        run: echo "Deploying revision ${{ github.sha }}"

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: deployed-dist

      - name: List deployment files
        run: ls -la deployed-dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployed wheel
        run: pip install deployed-dist/*.whl

      - name: Start deployed API (prod simulation)
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8001 &
          echo $! > uvicorn.pid
          sleep 5

      - name: Smoke test deployed API
        run: |
          curl --fail http://127.0.0.1:8001/health

      - name: Stop deployed API
        if: always()
        run: |
          kill $(cat uvicorn.pid) || true
          