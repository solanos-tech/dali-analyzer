name: Unified Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-draft-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: prod
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture release metadata
        id: meta
        run: echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify tag points to main history
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync backend dependencies
        run: uv sync
        working-directory: backend

      - name: Build backend package
        run: uv build
        working-directory: backend

      - name: Validate version parity
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BACKEND_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml','rb'))['project']['version'])")"
          FRONTEND_VERSION="$(node -p "require('./frontend/package.json').version")"
          test "$TAG_VERSION" = "$BACKEND_VERSION"
          test "$TAG_VERSION" = "$FRONTEND_VERSION"

      - name: Build runtime and source archives
        run: |
          bash scripts/release/build-runtime-package.sh "${GITHUB_REF_NAME}"
          bash scripts/release/build-source-package.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

      - name: Create or update draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          runtime_asset="release-artifacts/runtime-${tag}.zip"
          source_asset="release-artifacts/source-${tag}.zip"
          notes="Runtime + source release for ${tag}. Final publish happens only after acceptance jobs pass."

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Release ${tag}" \
              --notes "${notes}" \
              --draft=true
            gh release upload "${tag}" "${runtime_asset}" "${source_asset}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${tag}" "${runtime_asset}" "${source_asset}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Release ${tag}" \
              --notes "${notes}" \
              --draft \
              --verify-tag
          fi

  acceptance-linux:
    needs: prepare-draft-release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download runtime archive from draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p acceptance
          gh release download "${{ needs.prepare-draft-release.outputs.release_tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "runtime-${{ needs.prepare-draft-release.outputs.release_tag }}.zip" \
            --dir acceptance \
            --clobber

      - name: Unpack runtime archive
        run: |
          unzip -q "acceptance/runtime-${{ needs.prepare-draft-release.outputs.release_tag }}.zip" -d acceptance
          chmod +x "acceptance/runtime-${{ needs.prepare-draft-release.outputs.release_tag }}/launchers/start-linux.sh"
          chmod +x "acceptance/runtime-${{ needs.prepare-draft-release.outputs.release_tag }}/launchers/stop-linux.sh"

      - name: Start runtime and verify health/UI
        run: |
          cd "acceptance/runtime-${{ needs.prepare-draft-release.outputs.release_tag }}"
          ./launchers/start-linux.sh
          curl --silent --fail "http://127.0.0.1:8000/health" >/dev/null
          curl --silent --fail "http://127.0.0.1:8000/" >/dev/null

      - name: Stop runtime and verify shutdown
        run: |
          cd "acceptance/runtime-${{ needs.prepare-draft-release.outputs.release_tag }}"
          ./launchers/stop-linux.sh
          sleep 2
          if curl --silent --fail "http://127.0.0.1:8000/health" >/dev/null; then
            echo "ERROR: runtime still responds on /health after stop."
            exit 1
          fi

  acceptance-windows:
    needs: prepare-draft-release
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Download runtime archive from draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path acceptance | Out-Null
          gh release download "${{ needs.prepare-draft-release.outputs.release_tag }}" `
            --repo "${env:GITHUB_REPOSITORY}" `
            --pattern "runtime-${{ needs.prepare-draft-release.outputs.release_tag }}.zip" `
            --dir acceptance `
            --clobber

      - name: Unpack runtime archive
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "acceptance\runtime-${{ needs.prepare-draft-release.outputs.release_tag }}.zip" -DestinationPath acceptance -Force

      - name: Start runtime and verify health/UI
        shell: pwsh
        run: |
          $runtimeRoot = "acceptance\runtime-${{ needs.prepare-draft-release.outputs.release_tag }}"
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & "$runtimeRoot\launchers\start-windows.ps1"
          $health = Invoke-WebRequest -Uri "http://127.0.0.1:8000/health" -UseBasicParsing -TimeoutSec 10
          if ($health.StatusCode -ne 200) { throw "Health endpoint returned $($health.StatusCode)" }
          $ui = Invoke-WebRequest -Uri "http://127.0.0.1:8000/" -UseBasicParsing -TimeoutSec 10
          if ($ui.StatusCode -ne 200) { throw "UI endpoint returned $($ui.StatusCode)" }

      - name: Stop runtime and verify shutdown
        shell: pwsh
        run: |
          $runtimeRoot = "acceptance\runtime-${{ needs.prepare-draft-release.outputs.release_tag }}"
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & "$runtimeRoot\launchers\stop-windows.ps1"
          Start-Sleep -Seconds 2
          $listener = Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue
          if ($listener) { throw "Runtime still listens on port 8000 after stop." }

  publish-release:
    needs:
      - prepare-draft-release
      - acceptance-linux
      - acceptance-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod

    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ needs.prepare-draft-release.outputs.release_tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false
