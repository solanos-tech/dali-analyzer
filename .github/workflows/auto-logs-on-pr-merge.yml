name: Auto Logs on PR Merge

on:
  pull_request:
    types: [closed]
  push:
    paths:
      - ".github/workflows/auto-logs-on-pr-merge.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-logs-pr-merge:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      !startsWith(github.event.pull_request.head.ref, 'codex/auto-logs-')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update knowledge and decision logs
        id: update_logs
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          EVENT_KEY="pr-${PR_NUMBER}-${MERGE_SHA}"
          DATE_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          if grep -q "${EVENT_KEY}" docs/agent/knowledge-log.md || grep -q "${EVENT_KEY}" docs/agent/decision-log.md; then
            echo "No-op: event already logged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            printf '\n- Date (UTC): %s\n' "${DATE_UTC}"
            printf -- '- Event key: %s\n' "${EVENT_KEY}"
            printf -- '- Trigger: merged pull request\n'
            printf -- '- What changed: PR #%s merged to main\n' "${PR_NUMBER}"
            printf -- '- What improved: New increment was integrated and validated through review workflow\n'
            printf -- '- What failed or caused friction: none recorded by automation\n'
            printf -- '- Recommendation for next cycle: keep docs and release metadata updated in the same cycle\n'
            printf -- '- Related links: %s, commit %s\n' "${PR_URL}" "${MERGE_SHA}"
          } >> docs/agent/knowledge-log.md

          {
            printf '\n- Date (UTC): %s\n' "${DATE_UTC}"
            printf -- '- Event key: %s\n' "${EVENT_KEY}"
            printf -- '- Trigger: merged pull request\n'
            printf -- '- Decision: retain branch+PR workflow and create post-merge knowledge artifacts\n'
            printf -- '- Rationale: merged increments should leave audit-ready operational traces\n'
            printf -- '- Impact: improves repository memory and onboarding continuity\n'
            printf -- '- Related links: PR #%s (%s) by @%s - %s\n' "${PR_NUMBER}" "${PR_TITLE}" "${PR_AUTHOR}" "${PR_URL}"
          } >> docs/agent/decision-log.md

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create follow-up docs PR
        id: create_pr
        if: steps.update_logs.outputs.changed == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: auto-update logs after merge of PR #${{ github.event.pull_request.number }}"
          title: "docs: auto logs after PR #${{ github.event.pull_request.number }} merge"
          body: |
            Automated follow-up docs PR generated after merge of PR #${{ github.event.pull_request.number }}.

            Updates:
            - `docs/agent/knowledge-log.md`
            - `docs/agent/decision-log.md`

            Event key: `pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.merge_commit_sha }}`
          branch: codex/auto-logs-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          delete-branch: true
          labels: |
            documentation
            automation

      - name: Warn when follow-up PR could not be created
        if: steps.update_logs.outputs.changed == 'true' && steps.create_pr.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Auto-log entries were generated, but creating the follow-up PR failed."
          echo "::warning::Check repository settings for GitHub Actions pull request permissions."
