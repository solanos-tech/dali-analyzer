name: Integration Smoke

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/integration-smoke.yml"
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/integration-smoke.yml"

jobs:
  integration-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync backend dependencies
        run: uv sync
        working-directory: backend

      - name: Start backend
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo $! > uvicorn.pid
          sleep 5
        working-directory: backend

      - name: Smoke health
        run: curl --fail http://127.0.0.1:8000/health

      - name: Smoke frames
        run: curl --fail "http://127.0.0.1:8000/api/frames?source=mock"

      - name: Stop backend
        if: always()
        run: kill $(cat uvicorn.pid) || true
        working-directory: backend

